# Ticks the Zoho poller on the deployed LangGraph app.
#
# LangGraph Platform's own crons need a Plus/Enterprise plan and cannot be
# declared in langgraph.json — they take an API call. This does the same job
# from infrastructure that is already free here, and has the advantage of being
# visible in a UI you already read when it misfires.
#
# The notifier is NOT ticked here. A triage run that parks on `interrupt()`
# ends, and the platform calls the `run_finished` webhook, which posts the gate
# card seconds later instead of on the next tick. See slack/http_app.py.

name: Zoho poll

on:
  schedule:
    # Every 5 minutes. GitHub's scheduler drifts under load and skips ticks
    # entirely when busy, which is fine: `poll_once` is idempotent on ticket id
    # and `threads.create(if_exists="raise")` is the real once-per-ticket lock,
    # so a late tick picks up what an earlier one missed. Zoho's search index
    # also lags writes, so a sub-minute cadence would buy nothing.
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  # Two overlapping polls would both try to claim the same ticket. One would
  # lose on the 409 and report skipped_conflict, which is correct but wasteful.
  group: zoho-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Tick the poller
        env:
          LANGGRAPH_API_URL: ${{ secrets.LANGGRAPH_API_URL }}
          LANGGRAPH_API_KEY: ${{ secrets.LANGGRAPH_API_KEY }}
        run: |
          set -Eeuo pipefail
          [ -n "$LANGGRAPH_API_URL" ] || { echo "LANGGRAPH_API_URL not set"; exit 1; }
          [ -n "$LANGGRAPH_API_KEY" ] || { echo "LANGGRAPH_API_KEY not set"; exit 1; }

          # /runs/wait so this job's exit code reflects the poll, rather than
          # reporting success for a run that failed after we stopped looking.
          code=$(curl -sS -o response.json -w '%{http_code}' \
            -X POST "${LANGGRAPH_API_URL%/}/runs/wait" \
            -H "x-api-key: $LANGGRAPH_API_KEY" \
            -H 'content-type: application/json' \
            -d '{"assistant_id": "poller", "input": {}}')

          echo "HTTP $code"
          cat response.json; echo

          [ "$code" = "200" ] || { echo "poll failed"; exit 1; }

          # A run can return 200 having failed inside the graph. The report is
          # the poller's own account of the tick; treat a missing one as a
          # failure rather than as a quiet success.
          python3 - <<'PY'
          import json, sys
          d = json.load(open("response.json"))
          report = d.get("report")
          if not report:
              print("no report in response — the graph did not complete"); sys.exit(1)
          print(report)
          if d.get("errors"):
              print("errors:", d["errors"]); sys.exit(1)
          PY
