[project]
name = "pagerduty-triage"
version = "0.1.0"
description = "Zoho Desk triage -> sprint-tasks issue, with two human gates"
requires-python = ">=3.11"
dependencies = [
    # Verified by installing and reading the source, not recalled.
    # deepagents 0.7.14 requires langchain>=1.4 — a hard break from the
    # langchain 0.3.x line. Do not mix.
    "deepagents==0.7.14",
    "langchain>=1.4,<2",
    "langgraph>=1.2,<2",
    "langgraph-sdk>=0.2,<1",
    "langchain-anthropic>=1.0,<2",
    "mcp>=1.2",
    "httpx>=0.27",
    # The Slack interaction endpoint (langgraph.json -> http.app). The
    # platform runtime already ships Starlette; declared so `uvicorn
    # pagerduty_triage.slack.http_app:app` also works standalone.
    "starlette>=0.37",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
# `langgraph dev` — the local in-memory server. NOT in `dev`, and not a runtime
# dependency: the managed platform provides the server, and the test suite does
# not need one. It is only for running the graph on a laptop, which is what
# LIVERUN.md does, so it gets its own extra rather than being pulled into CI.
local = ["langgraph-cli[inmem]>=0.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# `py.typed` marks the package as shipping inline annotations, so a type
# checker or IDE reading the installed package honours them instead of
# treating it as untyped. It is not a source file, so it needs listing here or
# it is left out of the install.
[tool.setuptools.package-data]
pagerduty_triage = ["py.typed"]

# Pytest is configured in `pytest.ini`, NOT here. A `[tool.pytest.ini_options]`
# block used to sit at this spot; `pytest.ini` takes precedence over
# `pyproject.toml`, so that block was dead config that an IDE would read and
# pytest would ignore — two answers to "what is on the path during tests".
# One file only. See pytest.ini.
